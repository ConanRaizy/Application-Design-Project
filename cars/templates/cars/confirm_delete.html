{% extends 'cars/base.html' %}
{% block title %}Delete Vehicle — Mapps Cars{% endblock %}
{% block content %}
<div style="display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 65px);padding:2rem;">
  <div class="card" style="max-width:450px;width:100%;text-align:center;">
    <div style="font-size:2rem;margin-bottom:1rem;">⚠</div>
    <div class="card-title" style="text-align:center;border:none;color:#e07070;">Delete Vehicle</div>
    <div style="color:var(--muted);font-size:0.9rem;margin-bottom:1.5rem;">
      Are you sure you want to delete <strong style="color:var(--white);">{{ car }}</strong>?<br>
      This action cannot be undone.
    </div>
    <form method="post" style="display:flex;gap:1rem;justify-content:center;">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Yes, Delete</button>
      <a href="{% url 'manage_cars' %}" class="btn btn-outline">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
